{% extends "base.html" %}

{% block content %}
<div class="title">Usuarios</div>

<div class="actionsu">
    <form action="/agregar_usuario" method="POST" style="display:inline;">
        <button class="btn agregar">Agregar usuario</button>
    </form>
</div>

<table>
    <tr>
        <th>Id</th>
        <th>Nombre</th>
        <th>Usuario</th>
        <th>Rol</th>
        <th>Privilegio</th>
        <th>Acciones</th>
    </tr>

    {% for u in usuarios %}
    <tr>
        <td>{{ u.id_usuario }}</td>
        <td>{{ u.nombre }}</td>
        <td>{{ u.usuario }}</td>
        <td>{{ u.rol }}</td>
        <td>{{ u.privilegio }}</td>
        <td>
            <div class="actionsa">
                <!-- Actualizar -->
                <form action="/editar_usuario/{{ u.id }}" method="GET">
                    <button class="btn editar">Editar</button>
                </form>

                <!-- Eliminar -->
                <form action="/eliminar_usuario/{{ u.id }}" method="POST">
                    <button class="btn eliminar"
                            onclick="return confirm('¿Seguro que quieres eliminar este usuario?')">
                        Eliminar
                    </button>
                </form>
            </div>
        </td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
