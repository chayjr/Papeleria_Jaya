{% extends "base.html" %}

{% block content %}
<div class="title">Actualizar producto</div>

<form method="POST">
    <div class="campo">
        <label>Nombre del producto:</label>
        <input type="text" name="nombre" value="{{ producto.nombre }}"required>
    </div>

    <div class="campo">
        <label>Descripción:</label>
        <textarea name="descripcion" id="descripcion" required>{{ producto.descripcion}}</textarea>
    </div>

    <div class="campo">
        <label>Cantidad:</label>
        <input type="text" name="cantidad" min="1" value="{{ producto.cantidad }}" required>
    </div>

    <div class="campo">
        <label>Precio:</label>
        <input type="number" step="0.01" name="precio" min="0" value="{{ producto.precio }}" required>
    </div>

    <div class="actionsp">
        <form action="/productos">
            <button class="btn guardar" method="POST" style="display:inline;">Guardar producto</button>
            <a href="/productos" class="btn cancelar">Cancelar</a>
        </form>
    </div>


</form>
{% endblock %}
